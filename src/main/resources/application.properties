# 1. Doi cong chay server (Tranh loi ket port 8080)
server.port=8081

# 2. Cau hinh ket noi MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/livetech_auction?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

# 3. Cau hinh JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.thymeleaf.cache=false
gemini.api.key=YOUR_API_KEY_HERE

# ================================================================
# 4. CẤU HÌNH THANH TOÁN MÃ QR ĐỘNG (VIETQR / MBBANK / VIETINBANK)
# ================================================================
# Mã ngân hàng (Bank ID / BIN):
# - mbbank: Ngân hàng TMCP Quân đội (MBBank - Mã BIN: 970422)
# - ICB: VietinBank (Mã BIN: 970415)
# - VCB: Vietcombank (Mã BIN: 970436)
vietqr.bank-id=mbbank

# Số tài khoản ngân hàng nhận tiền
vietqr.account-no=3211230102005

# Tên chủ tài khoản ngân hàng (VIẾT HOA KHÔNG DẤU)
vietqr.account-name=NGUYEN TRAN DINH HIEU

# Mẫu hiển thị mã QR của VietQR (compact2, compact, qr_only, print)
vietqr.template=compact2

# Tiền tố nội dung chuyển khoản (Ví dụ: "LTA PAY ORDER ")
vietqr.memo-prefix=LTA PAY ORDER 
