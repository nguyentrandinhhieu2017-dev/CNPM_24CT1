<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký - LiveTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 rounded-lg">
                    <div class="card-header bg-primary text-white text-center">
                        <h3 class="my-2 fw-bold">Tạo Tài Khoản Mới</h3>
                    </div>
                    <div class="card-body p-4">
                        <!-- Thông báo lỗi Validation -->
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                        <form action="/register" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Họ và Tên</label>
                                <input type="text" name="fullName" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Email</label>
                                <input type="email" name="email" class="form-control" placeholder="vd: abc@gmail.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Tên đăng nhập (Viết liền không dấu)</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>
                          
							
							<div class="mb-4">
							    <label class="form-label fw-bold">Mật khẩu</label>
							    <!-- Đây này! Thuộc tính oninput ở ngay trong thẻ input này -->
							    <input type="password" id="passwordInput" name="password" class="form-control" required oninput="validatePassword()">
							    
							    <!-- Dòng thông báo lỗi (Mặc định bị ẩn đi) -->
							    <div id="passwordError" class="form-text text-danger d-none mt-2 fw-bold">
							        ❌ Mật khẩu phải dài ít nhất 6 ký tự, gồm chữ HOA, chữ thường và ký tự đặc biệt!
							    </div>
							</div>
							
                            <button type="submit" class="btn btn-primary w-100 fw-bold">Đăng Ký Ngay</button>
                        </form>
                    </div>
                    <div class="card-footer text-center py-3">
                        Đã có tài khoản? <a href="/login" class="text-decoration-none">Đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
	
	<script>
	    function validatePassword() {
	        const password = document.getElementById('passwordInput');
	        const errorText = document.getElementById('passwordError');
	        
	        // Regex kiểm tra: 1 chữ hoa, 1 chữ thường, 1 ký tự đặc biệt, tối thiểu 6 ký tự
	        const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*()_+~`|}{#\[\]:;?><,./-]).{6,}$/;
	        
	        // Nếu ô mật khẩu có chữ VÀ không khớp với quy tắc Regex
	        if (password.value.length > 0 && !regex.test(password.value)) {
	            errorText.classList.remove('d-none'); // Hiện cảnh báo đỏ
	            password.setCustomValidity("Mật khẩu chưa đủ mạnh"); // Chặn không cho bấm submit
	        } else {
	            errorText.classList.add('d-none'); // Ẩn cảnh báo
	            password.setCustomValidity(""); // Hợp lệ, cho phép submit
	        }
	    }
	</script>
	
</body>
</html>
