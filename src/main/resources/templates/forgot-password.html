<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Khôi phục mật khẩu - LiveTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 rounded-lg">
                    <div class="card-body p-5">
                        <h4 class="text-center fw-bold mb-4">Khôi Phục Mật Khẩu</h4>
                        <p class="text-muted text-center mb-4">Vui lòng nhập Email bạn đã dùng để đăng ký. Hệ thống sẽ cấp lại mật khẩu mới cho bạn.</p>
                        
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        
                        <form action="/forgot-password" method="post">
                            <div class="mb-4">
                                <input type="email" name="email" class="form-control form-control-lg" placeholder="Nhập địa chỉ Email..." required>
                            </div>
                            <button type="submit" class="btn btn-danger w-100 fw-bold btn-lg">Khôi phục ngay</button>
                        </form>
                    </div>
                    <div class="card-footer text-center py-3">
                        <a href="/login" class="text-decoration-none text-muted">← Quay lại Đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
