<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Trị Sản Phẩm - LiveTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar Quản Trị -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">⚙️ Admin Dashboard</a>
            <a href="/" class="btn btn-outline-light btn-sm">Xem Trang Chủ Web</a>
        </div>
    </nav>

    <div class="container">
        <h2 class="fw-bold mb-4">Quản Lý Sản Phẩm Đấu Giá</h2>
        
        <!-- Thông báo thành công/lỗi -->
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card shadow-sm">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Danh sách kho hàng</h5>
                <a th:href="@{/admin/products/new}" class="btn btn-primary fw-bold">+ Thêm Sản Phẩm</a>
            </div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Ảnh</th>
                            <th>Tên Sản Phẩm</th>
                            <th>Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${products}">
                            <td class="align-middle" th:text="${product.id}">1</td>
                            <td>
                                <img th:src="${product.imageUrl}" alt="Ảnh" style="width: 60px; height: 60px; object-fit: cover; border-radius: 8px;">
                            </td>
                            <td class="align-middle fw-bold" th:text="${product.productName}">Tên SP</td>
                            <td class="align-middle">
                                <a th:href="@{'/admin/products/edit/' + ${product.id}}" class="btn btn-sm btn-warning">Sửa</a>
                                <a th:href="@{'/admin/products/delete/' + ${product.id}}" class="btn btn-sm btn-danger" onclick="return confirm('Bạn có chắc chắn muốn xóa không?');">Xóa</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
