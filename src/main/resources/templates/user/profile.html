<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân - LiveTech Auction</title>

    <!-- Script chống chớp sáng (Anti-FOUC) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('livetech-theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-bs-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-bs-theme', 'light');
            }
        })();
    </script>

    <!-- Bootstrap 5.3 CDN & Font Awesome 6 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Đồng Bộ Toàn Dự Án: Trắng - Đen - Nâu Vintage -->
    <link rel="stylesheet" th:href="@{/css/livetech-vintage.css}" href="/css/livetech-vintage.css">
</head>
<body class="py-5">

    <!-- NÚT CHUYỂN ĐỔI CHẾ ĐỘ SÁNG / TỐI CỐ ĐỊNH GÓC TRÊN BÊN PHẢI -->
    <div class="theme-toggle-fixed" onclick="toggleTheme()" id="themeToggleBtn" title="Chuyển đổi giao diện Sáng / Tối">
        <i class="fa-solid fa-moon" id="themeToggleIcon"></i>
        <span id="themeToggleLabel">Chế độ Tối</span>
    </div>

    <div class="container mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center text-decoration-none" href="/">
                <i class="fa-solid fa-bolt-lightning fs-4 me-2" style="color: var(--brand-brown);"></i>
                <span class="fs-4 fw-bold brand-font" style="color: var(--text-primary);">
                    LiveTech <span style="color: var(--brand-brown);">Auction</span>
                </span>
            </a>
            <a href="/" class="btn btn-outline-brown btn-sm rounded-pill px-3 me-5 me-md-0">
                <i class="fa-solid fa-arrow-left me-1"></i>Trang chủ
            </a>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-7">
                <div class="card luxury-card p-4 p-md-5">
                    
                    <!-- Header Hồ Sơ -->
                    <div class="text-center mb-4 pb-3 border-bottom" style="border-color: var(--border-color) !important;">
                        <div class="position-relative d-inline-block mb-3">
                            <div class="rounded-circle d-flex align-items-center justify-content-center mx-auto" 
                                 style="width: 80px; height: 80px; background-color: var(--brand-brown-subtle); color: var(--brand-brown); border: 2px solid var(--brand-brown);">
                                <i class="fa-solid fa-user-gear fs-2"></i>
                            </div>
                        </div>
                        <h3 class="fw-bold mb-1 brand-font" style="color: var(--text-primary);">Thông Tin Cá Nhân & Địa Chỉ</h3>
                        <p class="text-muted small mb-0">Quản lý tài khoản và địa chỉ nhận hàng đấu giá</p>
                    </div>

                    <!-- Thông báo cập nhật thành công -->
                    <div th:if="${success}" class="alert alert-success d-flex align-items-center rounded-3 small py-2 mb-4" role="alert">
                        <i class="fa-solid fa-circle-check text-success me-2"></i>
                        <span th:text="${success}">Cập nhật thông tin thành công!</span>
                    </div>

                    <form th:action="@{/profile/update}" action="/profile/update" method="post">
                        <!-- Tên đăng nhập (Disabled) -->
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-secondary">
                                <i class="fa-solid fa-lock text-muted me-1"></i>Tên đăng nhập (Cố định):
                            </label>
                            <input type="text" class="form-control" th:value="${user != null ? user.username : 'nguyenvana'}" disabled>
                        </div>

                        <!-- Email (Disabled) -->
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-secondary">
                                <i class="fa-solid fa-envelope text-muted me-1"></i>Email đã xác thực:
                            </label>
                            <input type="email" class="form-control" th:value="${user != null ? user.email : 'user@gmail.com'}" disabled>
                        </div>

                        <!-- Họ và Tên (Cho phép sửa) -->
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-secondary">
                                <i class="fa-solid fa-user-pen me-1" style="color: var(--brand-brown);"></i>Họ và Tên:
                            </label>
                            <input type="text" name="fullName" class="form-control" th:value="${user != null ? user.fullName : 'Nguyễn Văn A'}" required>
                        </div>

                        <!-- Số điện thoại (Cho phép sửa) -->
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-secondary">
                                <i class="fa-solid fa-phone me-1" style="color: var(--brand-brown);"></i>Số điện thoại nhận hàng:
                            </label>
                            <input type="text" name="phone" class="form-control" th:value="${user != null ? user.phone : '0987 654 321'}" placeholder="Nhập số điện thoại...">
                        </div>

                        <!-- Địa chỉ (Cho phép sửa) -->
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-secondary">
                                <i class="fa-solid fa-location-dot me-1" style="color: var(--brand-brown);"></i>Địa chỉ giao hàng / nhận hàng:
                            </label>
                            <textarea name="address" class="form-control" rows="3" placeholder="Nhập địa chỉ chi tiết..." th:text="${user != null ? user.address : 'Số 123 Đường Lê Lợi, Quận 1, TP. Hồ Chí Minh'}"></textarea>
                        </div>

                        <!-- Nút Lưu Thay Đổi Tone Nâu -->
                        <button type="submit" class="btn btn-brand-brown btn-lg w-100 py-3 shadow-sm mb-3">
                            <i class="fa-solid fa-floppy-disk me-2"></i>Lưu Thay Đổi
                        </button>

                        <div class="text-center pt-2">
                            <a href="/" class="text-decoration-none small text-muted">
                                <i class="fa-solid fa-arrow-left me-1"></i>Quay về Trang chủ
                            </a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS & Theme Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme-toggle.js}" src="/js/theme-toggle.js"></script>
</body>
</html>
