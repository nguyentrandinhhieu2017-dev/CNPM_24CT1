<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - LiveTech Auction</title>

    <!-- Script chống chớp sáng (Anti-FOUC) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('livetech-theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-bs-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-bs-theme', 'light');
            }
        })();
    </script>

    <!-- Bootstrap 5.3 CDN & Font Awesome 6 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Đồng Bộ Toàn Dự Án: Trắng - Đen - Nâu Vintage -->
    <link rel="stylesheet" th:href="@{/css/livetech-vintage.css}" href="/css/livetech-vintage.css">
</head>
<body class="min-vh-100 d-flex align-items-center py-5">

    <!-- NÚT CHUYỂN ĐỔI CHẾ ĐỘ SÁNG / TỐI CỐ ĐỊNH GÓC TRÊN BÊN PHẢI -->
    <div class="theme-toggle-fixed" onclick="toggleTheme()" id="themeToggleBtn" title="Chuyển đổi giao diện Sáng / Tối">
        <i class="fa-solid fa-moon" id="themeToggleIcon"></i>
        <span id="themeToggleLabel">Chế độ Tối</span>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <div class="card luxury-card p-4 p-md-5">
                    
                    <!-- Logo & Tiêu đề Brand -->
                    <div class="text-center mb-4">
                        <div class="p-3 d-inline-flex rounded-circle mb-3" style="background-color: var(--brand-brown-subtle); color: var(--brand-brown);">
                            <i class="fa-solid fa-bolt-lightning fs-2"></i>
                        </div>
                        <h2 class="fw-bold mb-1 brand-font" style="color: var(--text-primary);">Đăng Nhập</h2>
                        <p class="text-muted small mb-0">Hệ thống đấu giá thiết bị công nghệ LiveTech</p>
                    </div>

                    <!-- Khung hiển thị thông báo lỗi / thành công (Thymeleaf) -->
                    <div th:if="${error}" class="alert alert-danger text-center small py-2 mb-3 rounded-3" role="alert" th:text="${error}">
                        Thông báo lỗi
                    </div>
                    <div th:if="${success}" class="alert alert-success text-center small py-2 mb-3 rounded-3" role="alert" th:text="${success}">
                        Thông báo thành công
                    </div>

                    <!-- Form đăng nhập -->
                    <form th:action="@{/login}" method="post">
                        <!-- Tên đăng nhập -->
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-secondary">
                                <i class="fa-solid fa-user me-1" style="color: var(--brand-brown);"></i>Tên đăng nhập
                            </label>
                            <input type="text" class="form-control form-control-lg fs-6" name="username" placeholder="Nhập tên đăng nhập..." required>
                        </div>
                        
                        <!-- Mật khẩu -->
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-secondary">
                                <i class="fa-solid fa-lock me-1" style="color: var(--brand-brown);"></i>Mật khẩu
                            </label>
                            <input type="password" class="form-control form-control-lg fs-6" name="password" placeholder="Nhập mật khẩu..." required>
                        </div>

                        <!-- Quên mật khẩu link -->
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                                <label class="form-check-label small text-muted" for="rememberMe">Ghi nhớ</label>
                            </div>
                            <a href="/forgot-password" class="text-decoration-none small" style="color: var(--brand-brown); font-weight: 600;">
                                Quên mật khẩu?
                            </a>
                        </div>

                        <!-- Nút Đăng nhập Tone Nâu Luxury -->
                        <button type="submit" class="btn btn-brand-brown btn-lg w-100 py-3 shadow-sm mb-3">
                            <i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Đăng Nhập
                        </button>
                        
                        <!-- Chuyển qua Đăng ký -->
                        <div class="mt-4 pt-3 text-center border-top" style="border-color: var(--border-subtle) !important;">
                            <span class="text-muted small">Chưa có tài khoản?</span>
                            <a href="/register" class="text-decoration-none fw-bold ms-1" style="color: var(--brand-brown);">
                                Đăng ký ngay
                            </a>
                            <div class="mt-3">
                                <a href="/" class="text-decoration-none text-muted small">
                                    <i class="fa-solid fa-arrow-left me-1"></i>Quay lại Trang chủ
                                </a>
                            </div>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS & Theme Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme-toggle.js}" src="/js/theme-toggle.js"></script>
</body>
</html>
