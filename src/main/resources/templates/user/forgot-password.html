<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khôi Phục Mật Khẩu - LiveTech Auction</title>

    <script>
        (function() {
            const savedTheme = localStorage.getItem('livetech-theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-bs-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-bs-theme', 'light');
            }
        })();
    </script>

    <!-- Bootstrap 5.3 CDN & Font Awesome 6 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Đồng Bộ Toàn Dự Án: Trắng - Đen - Nâu Vintage -->
    <link rel="stylesheet" th:href="@{/css/livetech-vintage.css}" href="/css/livetech-vintage.css">
</head>
<body class="min-vh-100 d-flex align-items-center py-5">

    <!-- NÚT CHUYỂN ĐỔI CHẾ ĐỘ SÁNG / TỐI CỐ ĐỊNH GÓC PHẢI TRÊN -->
    <div class="theme-toggle-fixed" onclick="toggleTheme()" id="themeToggleBtn" title="Chuyển đổi giao diện Sáng / Tối">
        <i class="fa-solid fa-moon" id="themeToggleIcon"></i>
        <span id="themeToggleLabel">Chế độ Tối</span>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <div class="card luxury-card p-4 p-md-5">
                    
                    <div class="text-center mb-4">
                        <div class="p-3 d-inline-flex rounded-circle mb-3" style="background-color: var(--brand-brown-subtle); color: var(--brand-brown);">
                            <i class="fa-solid fa-key fs-2"></i>
                        </div>
                        <h2 class="fw-bold mb-1 brand-font">Khôi Phục Mật Khẩu</h2>
                        <p class="text-muted small mb-0">Nhập email đăng ký để nhận lại mật khẩu</p>
                    </div>

                    <div th:if="${error}" class="alert alert-danger text-center small py-2 mb-3 rounded-3" role="alert" th:text="${error}"></div>
                    <div th:if="${success}" class="alert alert-success text-center small py-2 mb-3 rounded-3" role="alert" th:text="${success}"></div>

                    <form th:action="@{/forgot-password}" action="/forgot-password" method="post">
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-secondary">
                                <i class="fa-solid fa-envelope me-1" style="color: var(--brand-brown);"></i>Địa chỉ Email của bạn:
                            </label>
                            <input type="email" name="email" class="form-control form-control-lg fs-6" placeholder="Nhập email của bạn..." required>
                        </div>
                        <button type="submit" class="btn btn-brand-brown btn-lg w-100 py-3 shadow-sm mb-3">
                            <i class="fa-solid fa-paper-plane me-2"></i>Gửi Yêu Cầu Cấp Lại
                        </button>
                        <div class="text-center pt-2">
                            <a href="/login" class="text-decoration-none small text-muted">
                                <i class="fa-solid fa-arrow-left me-1"></i>Quay lại Đăng nhập
                            </a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme-toggle.js}" src="/js/theme-toggle.js"></script>
</body>
</html>
