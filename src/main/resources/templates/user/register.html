<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - LiveTech Auction</title>

    <!-- Script chống chớp sáng (Anti-FOUC) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('livetech-theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-bs-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-bs-theme', 'light');
            }
        })();
    </script>

    <!-- Bootstrap 5.3 CDN & Font Awesome 6 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Đồng Bộ Toàn Dự Án: Trắng - Đen - Nâu Vintage -->
    <link rel="stylesheet" th:href="@{/css/livetech-vintage.css}" href="/css/livetech-vintage.css">
</head>
<body class="min-vh-100 d-flex align-items-center py-5">

    <!-- NÚT CHUYỂN ĐỔI CHẾ ĐỘ SÁNG / TỐI CỐ ĐỊNH GÓC TRÊN BÊN PHẢI -->
    <div class="theme-toggle-fixed" onclick="toggleTheme()" id="themeToggleBtn" title="Chuyển đổi giao diện Sáng / Tối">
        <i class="fa-solid fa-moon" id="themeToggleIcon"></i>
        <span id="themeToggleLabel">Chế độ Tối</span>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <div class="card luxury-card p-4 p-md-5">
                    
                    <!-- Logo & Tiêu đề Brand -->
                    <div class="text-center mb-4">
                        <div class="p-3 d-inline-flex rounded-circle mb-3" style="background-color: var(--brand-brown-subtle); color: var(--brand-brown);">
                            <i class="fa-solid fa-user-plus fs-2"></i>
                        </div>
                        <h2 class="fw-bold mb-1 brand-font" style="color: var(--text-primary);">Tạo Tài Khoản Mới</h2>
                        <p class="text-muted small mb-0">Tham gia sàn đấu giá công nghệ LiveTech</p>
                    </div>

                    <!-- Thông báo lỗi Validation -->
                    <div th:if="${error}" class="alert alert-danger text-center small py-2 mb-3 rounded-3" role="alert" th:text="${error}">
                        Thông báo lỗi
                    </div>

                    <form th:action="@{/register}" action="/register" method="post">
                        <!-- Họ và Tên -->
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-secondary">
                                <i class="fa-solid fa-signature me-1" style="color: var(--brand-brown);"></i>Họ và Tên
                            </label>
                            <input type="text" name="fullName" class="form-control form-control-lg fs-6" placeholder="Ví dụ: Nguyễn Văn A" required>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-secondary">
                                <i class="fa-solid fa-envelope me-1" style="color: var(--brand-brown);"></i>Email
                            </label>
                            <input type="email" name="email" class="form-control form-control-lg fs-6" placeholder="vd: abc@gmail.com" required>
                        </div>

                        <!-- Tên đăng nhập -->
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-secondary">
                                <i class="fa-solid fa-user-tag me-1" style="color: var(--brand-brown);"></i>Tên đăng nhập (Viết liền không dấu)
                            </label>
                            <input type="text" name="username" class="form-control form-control-lg fs-6" placeholder="Ví dụ: nguyenvana" required>
                        </div>
                      
                        <!-- Mật khẩu -->
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-secondary">
                                <i class="fa-solid fa-lock me-1" style="color: var(--brand-brown);"></i>Mật khẩu
                            </label>
                            <input type="password" id="passwordInput" name="password" class="form-control form-control-lg fs-6" placeholder="Tối thiểu 6 ký tự..." required oninput="validatePassword()">
                            
                            <!-- Dòng thông báo lỗi quy chuẩn mật khẩu -->
                            <div id="passwordError" class="form-text d-none mt-2 small fw-semibold" style="color: var(--price-color);">
                                <i class="fa-solid fa-circle-exclamation me-1"></i>Mật khẩu phải dài ít nhất 6 ký tự, gồm chữ HOA, chữ thường và ký tự đặc biệt!
                            </div>
                        </div>
                        
                        <!-- Nút Đăng ký Tone Nâu Brand -->
                        <button type="submit" class="btn btn-brand-brown btn-lg w-100 py-3 shadow-sm mb-3">
                            <i class="fa-solid fa-user-check me-2"></i>Đăng Ký Ngay
                        </button>

                        <div class="mt-4 pt-3 text-center border-top" style="border-color: var(--border-subtle) !important;">
                            <span class="text-muted small">Đã có tài khoản?</span>
                            <a href="/login" class="text-decoration-none fw-bold ms-1" style="color: var(--brand-brown);">
                                Đăng nhập
                            </a>
                            <div class="mt-3">
                                <a href="/" class="text-decoration-none text-muted small">
                                    <i class="fa-solid fa-arrow-left me-1"></i>Quay lại Trang chủ
                                </a>
                            </div>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
    
    <script>
        function validatePassword() {
            const password = document.getElementById('passwordInput');
            const errorText = document.getElementById('passwordError');
            
            // Regex: 1 chữ hoa, 1 chữ thường, 1 ký tự đặc biệt, tối thiểu 6 ký tự
            const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*()_+~`|}{#\[\]:;?><,./-]).{6,}$/;
            
            if (password.value.length > 0 && !regex.test(password.value)) {
                errorText.classList.remove('d-none');
                password.setCustomValidity("Mật khẩu chưa đủ mạnh");
            } else {
                errorText.classList.add('d-none');
                password.setCustomValidity("");
            }
        }
    </script>

    <!-- Bootstrap 5.3 JS & Theme Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme-toggle.js}" src="/js/theme-toggle.js"></script>
</body>
</html>
