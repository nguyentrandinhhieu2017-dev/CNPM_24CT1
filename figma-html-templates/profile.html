<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân - LiveTech</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
    </style>
</head>
<body class="bg-light min-vh-100 d-flex align-items-center py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                    <!-- Header -->
                    <div class="card-header bg-dark text-white text-center py-4">
                        <div class="mb-2">
                            <i class="bi bi-person-circle fs-1"></i>
                        </div>
                        <h4 class="mb-1 fw-bold">Thông Tin Cá Nhân & Địa Chỉ</h4>
                        <small class="opacity-75">Quản lý thông tin tài khoản LiveTech của bạn</small>
                    </div>

                    <!-- Body -->
                    <div class="card-body p-4 p-md-5">

                        <!-- Khung thông báo thành công mẫu (Chuyển đổi từ th:if="${success}") -->
                        <div class="alert alert-success d-flex align-items-center mb-4 d-none" role="alert" id="successAlert">
                            <i class="bi bi-check-circle-fill flex-shrink-0 me-2"></i>
                            <div>Cập nhật thông tin thành công!</div>
                        </div>

                        <!-- Form cập nhật hồ sơ -->
                        <form action="/profile/update" method="post">
                            <!-- Tên đăng nhập (Disabled) -->
                            <div class="mb-3">
                                <label for="username" class="form-label fw-bold text-secondary">
                                    <i class="bi bi-person-badge me-1"></i>Tên đăng nhập (Cố định):
                                </label>
                                <input 
                                    type="text" 
                                    id="username" 
                                    class="form-control form-control-lg fs-6 bg-light text-muted" 
                                    value="nguyenvana" 
                                    disabled>
                            </div>

                            <!-- Email (Disabled) -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold text-secondary">
                                    <i class="bi bi-envelope me-1"></i>Email:
                                </label>
                                <input 
                                    type="email" 
                                    id="email" 
                                    class="form-control form-control-lg fs-6 bg-light text-muted" 
                                    value="user@gmail.com" 
                                    disabled>
                            </div>

                            <!-- Họ và Tên -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-bold text-secondary">
                                    <i class="bi bi-person me-1"></i>Họ và Tên:
                                </label>
                                <input 
                                    type="text" 
                                    id="fullName" 
                                    name="fullName" 
                                    class="form-control form-control-lg fs-6" 
                                    value="Nguyễn Văn A" 
                                    required>
                            </div>

                            <!-- Số điện thoại -->
                            <div class="mb-3">
                                <label for="phone" class="form-label fw-bold text-secondary">
                                    <i class="bi bi-telephone me-1"></i>Số điện thoại:
                                </label>
                                <input 
                                    type="text" 
                                    id="phone" 
                                    name="phone" 
                                    class="form-control form-control-lg fs-6" 
                                    value="0987654321" 
                                    placeholder="Nhập số điện thoại...">
                            </div>

                            <!-- Địa chỉ -->
                            <div class="mb-4">
                                <label for="address" class="form-label fw-bold text-secondary">
                                    <i class="bi bi-geo-alt me-1"></i>Địa chỉ giao hàng / nhận hàng:
                                </label>
                                <textarea 
                                    id="address" 
                                    name="address" 
                                    class="form-control fs-6" 
                                    rows="3" 
                                    placeholder="Nhập địa chỉ chi tiết...">Số 123 Đường Lê Lợi, Quận 1, TP. Hồ Chí Minh</textarea>
                            </div>

                            <!-- Nút Lưu -->
                            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm py-3">
                                <i class="bi bi-floppy me-2"></i>Lưu Thay Đổi
                            </button>
                        </form>
                    </div>

                    <!-- Footer -->
                    <div class="card-footer bg-light text-center py-3 border-top">
                        <a href="/" class="text-decoration-none text-secondary small fw-semibold">
                            <i class="bi bi-arrow-left me-1"></i>Quay về Trang chủ
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
