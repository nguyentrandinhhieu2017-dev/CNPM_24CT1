<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khôi phục mật khẩu - LiveTech</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
    </style>
</head>
<body class="bg-light min-vh-100 d-flex align-items-center py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="mb-3">
                                <i class="bi bi-key-fill text-danger fs-1"></i>
                            </div>
                            <h4 class="fw-bold">Khôi Phục Mật Khẩu</h4>
                            <p class="text-muted small mb-0">Vui lòng nhập Email bạn đã dùng để đăng ký. Hệ thống sẽ cấp lại mật khẩu mới cho bạn.</p>
                        </div>
                        
                        <!-- Thông báo lỗi (Chuyển đổi từ th:if="${error}") -->
                        <div class="alert alert-danger d-flex align-items-center mb-4 d-none" role="alert" id="errorAlert">
                            <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2"></i>
                            <div>Email không tồn tại trong hệ thống!</div>
                        </div>
                        
                        <form action="/forgot-password" method="post">
                            <div class="mb-4">
                                <label for="email" class="form-label fw-bold text-secondary">
                                    <i class="bi bi-envelope me-1"></i>Email đã đăng ký
                                </label>
                                <input 
                                    type="email" 
                                    id="email" 
                                    name="email" 
                                    class="form-control form-control-lg fs-6" 
                                    placeholder="Nhập địa chỉ Email của bạn..." 
                                    autocomplete="email" 
                                    required>
                            </div>
                            <button type="submit" class="btn btn-danger w-100 fw-bold btn-lg shadow-sm py-3">
                                <i class="bi bi-send-check me-2"></i>Khôi phục ngay
                            </button>
                        </form>
                    </div>
                    <div class="card-footer bg-light text-center py-3 border-top">
                        <a href="/login" class="text-decoration-none text-secondary fw-semibold small">
                            <i class="bi bi-arrow-left me-1"></i>Quay lại Đăng nhập
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
