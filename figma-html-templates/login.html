<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - LiveTech</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
    </style>
</head>
<body class="bg-light min-vh-100 d-flex align-items-center py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                    <!-- Header -->
                    <div class="card-header bg-success text-white text-center py-4">
                        <div class="mb-2">
                            <i class="bi bi-shield-lock-fill fs-1"></i>
                        </div>
                        <h4 class="mb-0 fw-bold">Đăng Nhập Hệ Thống</h4>
                        <small class="opacity-75">Chào mừng bạn quay trở lại LiveTech</small>
                    </div>

                    <!-- Body -->
                    <div class="card-body p-4 p-md-5">

                        <!-- Khung thông báo mẫu (Đã chuyển đổi từ th:if="${error}" / th:text) -->
                        <!-- Để ẩn/hiện trong thiết kế Figma, có thể chỉnh sửa layer này dễ dàng -->
                        <div class="alert alert-danger d-flex align-items-center mb-4 d-none" role="alert" id="errorAlert">
                            <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2"></i>
                            <div>Tên đăng nhập hoặc mật khẩu không chính xác!</div>
                        </div>

                        <!-- Form gửi dữ liệu (Chuyển th:action="@{/login}" thành action="/login") -->
                        <form action="/login" method="post">
                            <!-- Username Input -->
                            <div class="mb-3">
                                <label for="username" class="form-label fw-bold text-secondary">
                                    <i class="bi bi-person me-1"></i>Tên đăng nhập:
                                </label>
                                <input 
                                    type="text" 
                                    class="form-control form-control-lg fs-6" 
                                    id="username" 
                                    name="username" 
                                    placeholder="Nhập tên đăng nhập của bạn" 
                                    autocomplete="username" 
                                    required>
                            </div>
                            
                            <!-- Password Input -->
                            <div class="mb-3">
                                <label for="password" class="form-label fw-bold text-secondary">
                                    <i class="bi bi-key me-1"></i>Mật khẩu:
                                </label>
                                <input 
                                    type="password" 
                                    class="form-control form-control-lg fs-6" 
                                    id="password" 
                                    name="password" 
                                    placeholder="Nhập mật khẩu" 
                                    autocomplete="current-password" 
                                    required>
                            </div>
                            
                            <!-- Forgot Password Link -->
                            <div class="text-end mb-4">
                                <a href="/forgot-password" class="text-decoration-none small text-danger fw-semibold">
                                    Quên mật khẩu?
                                </a>
                            </div>

                            <!-- Submit Button -->
                            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm py-3">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Đăng Nhập
                            </button>
                            
                            <!-- Footer Links -->
                            <div class="mt-4 pt-2 text-center border-top">
                                <p class="mb-2 text-muted">
                                    Chưa có tài khoản? 
                                    <a href="/register" class="text-decoration-none fw-bold text-success">Đăng ký ngay</a>
                                </p>
                                <a href="/" class="text-decoration-none text-secondary small">
                                    <i class="bi bi-arrow-left me-1"></i>Quay lại Trang chủ
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
