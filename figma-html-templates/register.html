<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - LiveTech</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
    </style>
</head>
<body class="bg-light min-vh-100 d-flex align-items-center py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                    <!-- Header -->
                    <div class="card-header bg-primary text-white text-center py-4">
                        <div class="mb-2">
                            <i class="bi bi-person-plus-fill fs-1"></i>
                        </div>
                        <h3 class="my-1 fw-bold">Tạo Tài Khoản Mới</h3>
                        <small class="opacity-75">Tham gia cùng cộng đồng LiveTech</small>
                    </div>

                    <!-- Body -->
                    <div class="card-body p-4 p-md-5">

                        <!-- Khung thông báo lỗi (Chuyển đổi từ th:if="${error}" / th:text) -->
                        <div class="alert alert-danger d-flex align-items-center mb-4 d-none" role="alert" id="errorAlert">
                            <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2"></i>
                            <div>Đã có lỗi xảy ra trong quá trình đăng ký!</div>
                        </div>

                        <!-- Form gửi dữ liệu (Chuyển th:action sang action="/register") -->
                        <form action="/register" method="post" id="registerForm">
                            <!-- Họ và Tên -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-bold text-secondary">
                                    <i class="bi bi-card-text me-1"></i>Họ và Tên
                                </label>
                                <input 
                                    type="text" 
                                    id="fullName" 
                                    name="fullName" 
                                    class="form-control form-control-lg fs-6" 
                                    placeholder="Nhập họ và tên đầy đủ" 
                                    autocomplete="name" 
                                    required>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold text-secondary">
                                    <i class="bi bi-envelope me-1"></i>Email
                                </label>
                                <input 
                                    type="email" 
                                    id="email" 
                                    name="email" 
                                    class="form-control form-control-lg fs-6" 
                                    placeholder="vd: abc@gmail.com" 
                                    autocomplete="email" 
                                    required>
                            </div>

                            <!-- Tên đăng nhập -->
                            <div class="mb-3">
                                <label for="username" class="form-label fw-bold text-secondary">
                                    <i class="bi bi-person me-1"></i>Tên đăng nhập (Viết liền không dấu)
                                </label>
                                <input 
                                    type="text" 
                                    id="username" 
                                    name="username" 
                                    class="form-control form-control-lg fs-6" 
                                    placeholder="Ví dụ: nguyenvana" 
                                    autocomplete="username" 
                                    required>
                            </div>
                          
                            <!-- Mật khẩu -->
                            <div class="mb-4">
                                <label for="passwordInput" class="form-label fw-bold text-secondary">
                                    <i class="bi bi-lock me-1"></i>Mật khẩu
                                </label>
                                <input 
                                    type="password" 
                                    id="passwordInput" 
                                    name="password" 
                                    class="form-control form-control-lg fs-6" 
                                    placeholder="Tối thiểu 6 ký tự, gồm HOA, thường & ký tự đặc biệt" 
                                    autocomplete="new-password" 
                                    required 
                                    oninput="validatePassword()">
                                
                                <!-- Dòng thông báo lỗi quy chuẩn mật khẩu -->
                                <div id="passwordError" class="form-text text-danger d-none mt-2 fw-semibold">
                                    <i class="bi bi-x-circle me-1"></i>Mật khẩu phải dài ít nhất 6 ký tự, gồm chữ HOA, chữ thường và ký tự đặc biệt!
                                </div>
                            </div>
                            
                            <!-- Nút Submit -->
                            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm py-3">
                                <i class="bi bi-check-circle me-2"></i>Đăng Ký Ngay
                            </button>
                        </form>
                    </div>

                    <!-- Footer -->
                    <div class="card-footer bg-light text-center py-3 border-top">
                        <span class="text-muted">Đã có tài khoản?</span> 
                        <a href="/login" class="text-decoration-none fw-bold text-primary">Đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Script kiểm tra mật khẩu giữ nguyên chuẩn logic client -->
    <script>
        function validatePassword() {
            const password = document.getElementById('passwordInput');
            const errorText = document.getElementById('passwordError');
            
            // Regex kiểm tra: 1 chữ hoa, 1 chữ thường, 1 ký tự đặc biệt, tối thiểu 6 ký tự
            const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*()_+~`|}{#\[\]:;?><,./-]).{6,}$/;
            
            if (password.value.length > 0 && !regex.test(password.value)) {
                errorText.classList.remove('d-none');
                password.setCustomValidity("Mật khẩu chưa đủ mạnh");
            } else {
                errorText.classList.add('d-none');
                password.setCustomValidity("");
            }
        }
    </script>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
