<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân - LiveTech Auction</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f4f6f9;
        }
    </style>
</head>
<body class="min-vh-100 py-5">

    <!-- Header điều hướng mini -->
    <div class="container mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold text-dark fs-4 text-decoration-none" href="index.html">
                <i class="fa-solid fa-bolt-lightning text-warning me-2"></i>LiveTech Auction
            </a>
            <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                <i class="fa-solid fa-arrow-left me-1"></i>Quay lại Trang chủ
            </a>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <!-- Card Hồ Sơ Căn Giữa -->
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                    <!-- Card Header -->
                    <div class="card-header bg-dark text-white text-center py-4">
                        <div class="position-relative d-inline-block mb-3">
                            <img 
                                src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" 
                                class="rounded-circle border border-3 border-white shadow" 
                                style="width: 80px; height: 80px; object-fit: cover;" 
                                alt="Avatar">
                            <span class="position-absolute bottom-0 end-0 bg-success p-1 rounded-circle border border-2 border-white">
                                <span class="visually-hidden">Online</span>
                            </span>
                        </div>
                        <h4 class="mb-1 fw-bold">Thông Tin Cá Nhân & Địa Chỉ</h4>
                        <p class="mb-0 small text-light opacity-75">Quản lý hồ sơ và thông tin nhận hàng khi thắng đấu giá</p>
                    </div>

                    <!-- Card Body -->
                    <div class="card-body p-4 p-md-5">

                        <!-- Thông báo mẫu đã cập nhật -->
                        <div class="alert alert-success d-flex align-items-center small py-2 mb-4" role="alert">
                            <i class="fa-solid fa-circle-check text-success me-2"></i>
                            <div>Hồ sơ của bạn đã được đồng bộ với hệ thống đấu giá LiveTech.</div>
                        </div>

                        <!-- Form Thông tin user -->
                        <form action="/profile/update" method="post">
                            
                            <!-- Username (Disable) -->
                            <div class="mb-3">
                                <label for="username" class="form-label fw-bold text-secondary small">
                                    <i class="fa-solid fa-lock text-muted me-1"></i>Tên đăng nhập (Cố định, không thể thay đổi):
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0">
                                        <i class="fa-solid fa-user-shield"></i>
                                    </span>
                                    <input 
                                        type="text" 
                                        class="form-control form-control-lg fs-6 bg-light text-muted border-start-0 ps-0" 
                                        id="username" 
                                        value="nguyenvana" 
                                        disabled>
                                </div>
                            </div>

                            <!-- Email (Disable) -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold text-secondary small">
                                    <i class="fa-solid fa-lock text-muted me-1"></i>Địa chỉ Email (Đã xác thực):
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0">
                                        <i class="fa-solid fa-envelope-circle-check text-success"></i>
                                    </span>
                                    <input 
                                        type="email" 
                                        class="form-control form-control-lg fs-6 bg-light text-muted border-start-0 ps-0" 
                                        id="email" 
                                        value="nguyenvana@gmail.com" 
                                        disabled>
                                </div>
                            </div>

                            <!-- Họ và Tên (Cho phép sửa) -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-bold text-secondary small">
                                    <i class="fa-solid fa-user-pen text-primary me-1"></i>Họ và Tên:
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0">
                                        <i class="fa-solid fa-signature text-secondary"></i>
                                    </span>
                                    <input 
                                        type="text" 
                                        class="form-control form-control-lg fs-6 border-start-0 ps-0" 
                                        id="fullName" 
                                        name="fullName" 
                                        value="Nguyễn Văn A" 
                                        placeholder="Nhập họ và tên..." 
                                        required>
                                </div>
                            </div>

                            <!-- Số điện thoại (Cho phép sửa) -->
                            <div class="mb-3">
                                <label for="phone" class="form-label fw-bold text-secondary small">
                                    <i class="fa-solid fa-phone text-primary me-1"></i>Số điện thoại nhận hàng:
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0">
                                        <i class="fa-solid fa-mobile-screen-button text-secondary"></i>
                                    </span>
                                    <input 
                                        type="text" 
                                        class="form-control form-control-lg fs-6 border-start-0 ps-0" 
                                        id="phone" 
                                        name="phone" 
                                        value="0987 654 321" 
                                        placeholder="Nhập số điện thoại...">
                                </div>
                            </div>

                            <!-- Textarea Địa chỉ (Cho phép sửa) -->
                            <div class="mb-4">
                                <label for="address" class="form-label fw-bold text-secondary small">
                                    <i class="fa-solid fa-map-location-dot text-primary me-1"></i>Địa chỉ nhận hàng chi tiết:
                                </label>
                                <textarea 
                                    class="form-control fs-6" 
                                    id="address" 
                                    name="address" 
                                    rows="3" 
                                    placeholder="Nhập số nhà, tên đường, phường/xã, quận/huyện...">Số 123 Đường Lê Lợi, Phường Bến Nghé, Quận 1, TP. Hồ Chí Minh</textarea>
                            </div>

                            <!-- Nút Lưu thay đổi -->
                            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm py-3 mb-2">
                                <i class="fa-solid fa-floppy-disk me-2"></i>Lưu Thay Đổi
                            </button>
                        </form>
                    </div>

                    <!-- Card Footer -->
                    <div class="card-footer bg-light text-center py-3 border-top">
                        <a href="index.html" class="text-decoration-none text-secondary small fw-semibold">
                            <i class="fa-solid fa-arrow-left me-1"></i>Quay về Trang chủ
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
